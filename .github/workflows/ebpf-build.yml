name: eBPF Build

on:
  pull_request:
    branches: ["**"]
    paths:
      - "bpf/**"
      - "**/*.c"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "Makefile"
      - ".github/workflows/ebpf-build.yml"
      - ".github/actions/setup-bpf-toolchain/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ebpf:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            goarch: amd64
            bpf_arch: x86
          - runner: ubuntu-26.04-arm
            goarch: arm64
            bpf_arch: arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install BPF toolchain
        uses: ./.github/actions/setup-bpf-toolchain

      - name: Install Go dependencies
        run: GOTOOLCHAIN=auto go mod download && GOTOOLCHAIN=auto go mod verify

      - name: Compile eBPF program
        run: |
          make internal/ebpf/embedded/podtrace.${{ matrix.goarch }}.bpf.o BPF_GOARCH=${{ matrix.goarch }}
          echo "eBPF object compiled via Makefile (arch=${{ matrix.bpf_arch }})"

      - name: Build Go binary
        run: GOTOOLCHAIN=auto GOARCH=${{ matrix.goarch }} go build -o bin/podtrace ./cmd/podtrace

      - name: Run embed smoke test
        run: GOTOOLCHAIN=auto GOARCH=${{ matrix.goarch }} go test -tags embed_bpf ./internal/ebpf/embedded/...

      - name: BPF loader + kernel verifier load-test
        run: sudo -E env "PATH=$PATH" make test-bpf-load GO=go BPF_GOARCH=${{ matrix.goarch }}

      - name: List outputs
        run: |
          echo "=== eBPF object (arch=${{ matrix.bpf_arch }}) ==="
          ls -lh internal/ebpf/embedded/podtrace.*.bpf.o
          echo "=== Go binary (goarch=${{ matrix.goarch }}) ==="
          ls -lh bin/podtrace
          file bin/podtrace

  verifier-build:
    name: verifier (build)
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install BPF toolchain
        uses: ./.github/actions/setup-bpf-toolchain

      - name: Compile eBPF program
        run: make internal/ebpf/embedded/podtrace.amd64.bpf.o BPF_GOARCH=amd64

      - name: Build the static kernel load test and vimto
        run: |
          set -euo pipefail
          mkdir -p verifier
          cp internal/ebpf/embedded/podtrace.amd64.bpf.o verifier/
          CGO_ENABLED=0 GOTOOLCHAIN=auto go test -c -tags bpf_loadtest \
            -o verifier/tracer-load.test ./internal/ebpf/tracer/
          CGO_ENABLED=0 GOBIN="${PWD}/verifier" GOTOOLCHAIN=auto go install lmb.io/vimto@v0.4.0

      - name: Upload the verifier bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verifier-bundle
          path: verifier/
          retention-days: 1
          if-no-files-found: error

  verifier-kernel-matrix:
    name: verifier (kernel ${{ matrix.kernel }})
    needs: verifier-build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: "5.15"
            image: ghcr.io/cilium/ci-kernels:5.15@sha256:bcf59f0dac62dfdcf2daec02a3cc8d03ed68a72e519913c191bfd609bde4b16e
          - kernel: "6.1"
            image: ghcr.io/cilium/ci-kernels:6.1@sha256:930a6a882906f1dab9dbeed14f0c778529b518cbc5c16b4b4d2e26e419295306
          - kernel: "6.6"
            image: ghcr.io/cilium/ci-kernels:6.6@sha256:a5ae8134b368aa42f53d14d92c16b39144e9d400ef220332c03aa8eeb360cefd
          - kernel: "6.12"
            image: ghcr.io/cilium/ci-kernels:6.12@sha256:d500a41bda6e2af9b69201877b0d356faae2e827d69e391f7eee4e45be3204cf

    steps:
      - name: Download the verifier bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: verifier-bundle
          path: verifier

      - name: Install QEMU and expose KVM
        run: |
          set -euo pipefail
          chmod +x verifier/vimto verifier/tracer-load.test
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-x86
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm

      - name: Boot kernel ${{ matrix.kernel }}
        timeout-minutes: 5
        env:
          KERNEL_IMAGE: ${{ matrix.image }}
        run: |
          verifier/vimto -kernel "${KERNEL_IMAGE}" -sudo exec -- /bin/uname -r < /dev/null

      - name: Load the collection on kernel ${{ matrix.kernel }}
        timeout-minutes: 10
        env:
          KERNEL_IMAGE: ${{ matrix.image }}
          PODTRACE_BPF_OBJECT: ${{ github.workspace }}/verifier/podtrace.amd64.bpf.o
        run: |
          verifier/vimto -kernel "${KERNEL_IMAGE}" -sudo -memory 2G exec -- \
            "${GITHUB_WORKSPACE}/verifier/tracer-load.test" -test.v -test.count=1 -test.timeout=5m \
            -test.run TestTracerCollectionLoadsOnRunningKernel < /dev/null
