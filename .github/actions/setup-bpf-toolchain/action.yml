name: Setup BPF toolchain
description: |
  Install clang, llvm, libbpf-dev, and kernel headers/tools needed to
  compile the eBPF programs in bpf/ and load them via the agent's tracer.

  Single source of truth so ebpf-build, chainsaw, and security workflows
  don't drift on package lists.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        sudo rm -f /etc/apt/sources.list.d/*google-chrome* \
                   /etc/apt/sources.list.d/*google-cloud* || true

        updated=0
        for attempt in 1 2 3; do
          if sudo apt-get -o Acquire::Retries=3 update; then
            updated=1
            break
          fi
          echo "::warning::apt-get update attempt ${attempt}/3 failed; retrying in 15s"
          sleep 15
        done
        if [ "${updated}" -ne 1 ]; then
          echo "::error::apt-get update failed after 3 attempts"
          exit 1
        fi

        sudo apt-get install -y --no-install-recommends \
          clang llvm libbpf-dev libelf-dev make pkg-config curl ca-certificates

        sudo apt-get install -y "linux-tools-$(uname -r)" \
          || sudo apt-get install -y linux-tools-azure \
          || sudo apt-get install -y linux-tools-generic || true
        sudo apt-get install -y "linux-headers-$(uname -r)" \
          || sudo apt-get install -y linux-headers-generic || true

        bpftool_works() { bpftool version 2>&1 | grep -qi 'bpftool v'; }

        ensure_bpftool() {
          bpftool_works && return 0

          local real
          real="$(find /usr -maxdepth 4 -type f -name bpftool 2>/dev/null \
            | grep -v '/sbin/bpftool$' | sort -V | tail -1 || true)"
          if [[ -n "${real}" ]]; then
            sudo install -m0755 "${real}" /usr/local/bin/bpftool
            hash -r
            bpftool_works && return 0
          fi

          local ver="v7.7.0"
          local arch want url tmp
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64) want="09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c" ;;
            arm64) want="d68443d945c146080151eb215bebaa400294ab7ada22af4f5d0a940f5992b9d9" ;;
            *) echo "::warning::no pinned bpftool for arch ${arch}"; return 1 ;;
          esac
          url="https://github.com/libbpf/bpftool/releases/download/${ver}/bpftool-${ver}-${arch}.tar.gz"
          tmp="$(mktemp)"
          if ! curl -fsSL "${url}" -o "${tmp}"; then
            rm -f "${tmp}"; return 1
          fi
          if ! echo "${want}  ${tmp}" | sha256sum -c - >/dev/null 2>&1; then
            echo "::error::bpftool ${ver} ${arch} checksum mismatch; refusing to install"
            rm -f "${tmp}"; return 1
          fi
          if ! sudo tar -C /usr/local/bin -xzf "${tmp}" bpftool; then
            rm -f "${tmp}"; return 1
          fi
          sudo chmod 0755 /usr/local/bin/bpftool || true
          rm -f "${tmp}"
          hash -r
          bpftool_works && return 0

          return 1
        }

        if ensure_bpftool; then
          echo "bpftool OK: $(command -v bpftool) ($(bpftool version 2>&1 | head -1))"
        else
          echo "WARNING: bpftool unusable; eBPF builds will use the stub vmlinux.h"
        fi
