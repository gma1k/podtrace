name: Install Helm
description: |
  Install a pinned helm release, checked against a sha256 pinned next to the
  version, and put it on PATH.

  azure/setup-helm downloads helm from get.helm.sh without verifying it, so a
  tampered tarball would run in the jobs that push and sign the chart. The
  sums below are the ones helm publishes for this release, whose tarballs are
  GPG-signed by a key in helm's KEYS file. A helm bump must update both sums
  in the same change, or every job that installs helm fails.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        ver="v4.3.1"
        case "$(uname -m)" in
          x86_64) arch="amd64"; want="0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b" ;;
          aarch64 | arm64) arch="arm64"; want="8cf8f66ecbc252ac8f7f06cca68aba88508ddfde3a6a34feb1678ad1694b4f88" ;;
          *) echo "::error::no pinned helm for arch $(uname -m)"; exit 1 ;;
        esac

        url="https://get.helm.sh/helm-${ver}-linux-${arch}.tar.gz"
        tmp="$(mktemp)"
        trap 'rm -f "${tmp}"' EXIT
        curl -fsSL --retry 3 --retry-delay 5 "${url}" -o "${tmp}"
        if ! echo "${want}  ${tmp}" | sha256sum -c - >/dev/null 2>&1; then
          echo "::error::helm ${ver} ${arch} checksum mismatch; refusing to install"
          exit 1
        fi

        bin="${RUNNER_TEMP}/helm-${ver}"
        mkdir -p "${bin}"
        tar -C "${bin}" --strip-components=1 -xzf "${tmp}" "linux-${arch}/helm"
        chmod 0755 "${bin}/helm"
        echo "${bin}" >> "${GITHUB_PATH}"
        "${bin}/helm" version
