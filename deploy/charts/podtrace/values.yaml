# Default values for the podtrace chart.
#
# The schema is organized top-down:
#   crds      CustomResourceDefinition installation
#   image     container image shared by operator, agent and session Jobs
#   namespace podtrace-system namespace management
#   operator  Deployment that runs the controller-runtime manager
#   agent     DaemonSet that runs the per-node tracer
#   session   Job template used for PodTraceSession forensic runs
#   webhook   validating webhook for the CRDs
#   rbac      optional overrides for cluster/namespaced RBAC
#   metrics   Prometheus ServiceMonitor / PodMonitor
#
# By default this chart installs everything required for a working
# Podtrace setup: CRDs, the podtrace-system namespace, the operator
# Deployment, and a default TracerConfig that brings up the agent
# DaemonSet with the continuous APM plane on: workload metrics, inspections,
# continuous profiling and kernel RTT, aggregated in the kernel. The agents'
# PodMonitor is on too and renders only where the Prometheus Operator is
# installed. The webhook and the operator's ServiceMonitor stay off by
# default, flip `webhook.enabled` / `metrics.serviceMonitor.enabled` once
# cert-manager and your Prometheus stack are wired up.

crds:
  install: true

  adopt: true

  labelerImage: ""

  keep: true

image:
  repository: ghcr.io/gma1k/podtrace
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

namespace:
  create: true
  name: podtrace-system
  labels: {}
  annotations: {}

operator:
  enabled: true
  replicas: 1
  leaderElect: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

agent:
  allowedImageRepos: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector: {}
  tolerations:
    - operator: Exists
      effect: NoSchedule
  affinity: {}
  priorityClassName: system-node-critical
  eventBufferSize: 10000
  statusReportInterval: 30s
  # auto and host both read the node's /sys/kernel/btf/vmlinux. Set "file" and
  # btfSource below only for a kernel built without CONFIG_DEBUG_INFO_BTF.
  btfMode: auto

  # Only read when btfMode is "file". Set exactly one of configMap or hostPath.
  # The ConfigMap lives in the release namespace and holds the blob under
  # binaryData; see docs/crd-tracerconfig.md for how to produce one.
  #   btfSource:
  #     configMap:
  #       name: node-btf
  #       key: vmlinux.btf
  btfSource: {}

  logLevel: ""

  dnsPacketCapture: true

  dnsFullAnswers: true

  usdt: true

  # Always-on per-workload CPU profile built from the user stacks already
  # captured on every sched_switch, served as JSON on the agent's /profile.
  # Needs nothing exposed by the workload and works for any language.
  # On by default; set false to stop building profiles.
  continuousProfiling: true

  # Attach a sock_ops program to read the kernel's own smoothed RTT, so
  # net.rtt_spike_rate measures the wire rather than syscall duration.
  # Observation only. Needs kernel 5.10+ and cgroup v2; where it cannot
  # attach the family is absent and the rule falls back to syscall latency.
  sockOpsRTT: true

  rolloutMaxUnavailable: ""

  alerting:
    enabled: false
    webhookURL: ""
    allowInsecureWebhook: false

  # The continuous APM plane: per-workload golden-signal metrics on the
  # agent's /metrics, and the inspections that raise issues from them. On by
  # default, so an install shows workload health without further setup; the
  # series budget below bounds it at 40k series per node when left at 0.
  # Set enabled: false to run podtrace as an on-demand tracer only.
  metrics:
    enabled: true

    excludeNamespaces:
      - podtrace-system

    seriesBudget: 0

    nativeHistograms: true

    semanticConventions: false

    # Fold observations into a BPF map instead of shipping each one through
    # the ring buffer, so the plane costs O(series) rather than O(events).
    # On by default. The one thing it gives up is exemplars, the trace id
    # linking a histogram bucket to a trace: those need the event, which only
    # reaches userspace while a PodTrace keeps the ring buffer open.
    kernelAggregation: true

    attributeCardinality: 0

    labels:
      pod: false
      process: false

    inspections:
      enabled: true

      interval: 30s

      alerts: true

      budget: 0

      holdTime: ""

      thresholds: {}

session:
  ttlSecondsAfterFinished: 300
  activeDeadlineOffset: 30s
  backoffLimit: 0
  maxConcurrentSessionsPerNode: 2
  maxDuration: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

webhook:
  enabled: false
  port: 9443
  certSource: cert-manager
  certManager:
    issuerRef:
      name: podtrace-selfsigned
      kind: Issuer
  caBundle: ""

rbac:
  create: true

metrics:
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    path: /metrics
  # On by default. Rendered only where the Prometheus Operator's
  # monitoring.coreos.com/v1 API exists, so it is safe on clusters without
  # it; the agent pods also carry prometheus.io/scrape annotations for
  # annotation-based scrapers.
  podMonitor:
    enabled: true
    labels: {}
    interval: 30s
    path: /metrics

networkPolicy:
  enabled: false
  metricsFrom: []

tracerConfig:
  create: true
  name: default
  sidecarUploader: false

  retainOnUninstall: false

  redaction:
    enabled: false
    redactDNSNames: false
    customRules: []

  capture:
    headers: []

examples:
  exporterconfig:
    enabled: false
    namespace: default
    name: starter-otlp
    endpoint: otel-collector.observability:4318
    protocol: http
    insecure: true
    samplePercent: null
    synthesizeSpans: false
