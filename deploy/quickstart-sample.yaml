# Quickstart demo workload + diagnose session.
#
# Published as quickstart-demo.yaml on each tagged release, applied as the
# SECOND step after quickstart.yaml (operator + CRDs). It is a separate file
# because kubectl cannot apply custom resources in the same invocation that
# installs their CRDs (client discovery-cache limitation):
#
#   kubectl apply -f https://github.com/gma1k/podtrace/releases/latest/download/quickstart.yaml
#   kubectl apply -f https://github.com/gma1k/podtrace/releases/latest/download/quickstart-demo.yaml
#
# After the operator becomes Ready, the PodTraceSession runs for 30s
# against the nginx Deployment and writes a human-readable report to
# the nginx-trace-report ConfigMap in the podtrace-demo namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: podtrace-demo
  labels:
    app.kubernetes.io/managed-by: podtrace-quickstart
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: podtrace-demo
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# Gives nginx a stable name for the loadgen to call, and a ClusterIP for
# the session to observe DNS and connect activity against.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: podtrace-demo
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
# Drives the traffic the session reports on: one 200 and one 404 per
# second, so the report shows request paths, status codes and latency
# rather than an empty collection period.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: podtrace-demo
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.9.1
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null http://nginx.podtrace-demo.svc.cluster.local/ || true
                curl -s -o /dev/null http://nginx.podtrace-demo.svc.cluster.local/missing || true
                sleep 1
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
# 30-second diagnose session against the nginx pod. Inspect the result:
#
#   kubectl get podtracesession demo-trace -n podtrace-demo
#   kubectl get cm nginx-trace-report -n podtrace-demo \
#     -o go-template='{{range $k,$v := .data}}{{$v}}{{end}}'
apiVersion: podtrace.io/v1alpha1
kind: PodTraceSession
metadata:
  name: demo-trace
  namespace: podtrace-demo
spec:
  selector:
    matchLabels:
      app: nginx
  duration: 30s
  filters: [dns, net, fs]
  # No exporterRef: this session only wants a local report. To ship spans
  # as well, add an ExporterConfig and reference it here.
  reportRef:
    configMap:
      name: nginx-trace-report
  ttlSecondsAfterFinished: 600
