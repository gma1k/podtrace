apiVersion: v1
kind: Pod
metadata:
  name: target
  labels:
    app: target
spec:
  nodeSelector:
    podtrace.io/test-redaction-pool: redacted
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 5; done"]
---
apiVersion: podtrace.io/v1alpha1
kind: ExporterConfig
metadata:
  name: ec
spec:
  type: otlp
  otlp:
    endpoint: "otel-collector.observability:4318"
    protocol: http
    insecure: true
