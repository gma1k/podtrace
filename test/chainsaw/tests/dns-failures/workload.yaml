apiVersion: v1
kind: Namespace
metadata:
  name: dns-failures
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-timeouts
  namespace: dns-failures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-timeouts
  template:
    metadata:
      labels:
        app: dns-timeouts
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lookups
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                nslookup -type=a -timeout=1 -retry=1 example.com 10.255.255.1 >/dev/null 2>&1
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-nxdomain
  namespace: dns-failures
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns-nxdomain
  template:
    metadata:
      labels:
        app: dns-nxdomain
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lookups
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                nslookup -type=a does-not-exist.invalid. >/dev/null 2>&1
                sleep 0.5
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
