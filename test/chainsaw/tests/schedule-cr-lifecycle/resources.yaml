apiVersion: podtrace.io/v1alpha1
kind: ExporterConfig
metadata:
  name: schedule-otlp
spec:
  type: otlp
  otlp:
    endpoint: otel-collector:4318
    protocol: http
    insecure: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schedule-chatty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schedule-target
  template:
    metadata:
      labels:
        app: schedule-target
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
          command:
            - sh
            - -c
            - |
              while true; do
                curl -sk -o /dev/null https://kubernetes.default.svc.cluster.local/livez || true
                sleep 1
              done
