apiVersion: v1
kind: Namespace
metadata:
  name: podtrace-test
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-cpu-test
  namespace: podtrace-test
  labels:
    app: nginx-cpu
spec:
  containers:
  - name: nginx
    image: nginx:1.31@sha256:6a3df739b6312289e87d70947d900669c1b3087474ece5814b9c01bbf2e6dde3
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    command:
    - sh
    - -c
    - |
      nginx
      while true; do
        for i in {1..1000}; do
          echo "CPU test $i" > /dev/null
        done
        sleep 0.1
      done
---
apiVersion: v1
kind: Pod
metadata:
  name: network-test
  namespace: podtrace-test
  labels:
    app: network-test
spec:
  containers:
  - name: network
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    command:
    - sh
    - -c
    - |
      while true; do
        nslookup google.com || true
        curl -s -o /dev/null http://httpbin.org/get || true
        sleep 1
      done
---
apiVersion: v1
kind: Pod
metadata:
  name: io-test
  namespace: podtrace-test
  labels:
    app: io-test
spec:
  containers:
  - name: io
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command:
    - sh
    - -c
    - |
      while true; do
        echo "I/O test $(date)" >> /tmp/io-test.log
        sync
        sleep 0.5
      done
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-test
  namespace: podtrace-test
  labels:
    app: memory-test
spec:
  containers:
  - name: memory
    image: python:3.15-slim@sha256:63bb298d2b7b88f176f51b5189f54ce6535c997682ea70885d2132f5d473a8a5
    command:
    - python3
    - -c
    - |
      import time
      data = []
      while True:
          data.append(bytearray(1024 * 1024))
          time.sleep(0.1)
          if len(data) > 10:
              data.pop(0)
---
apiVersion: v1
kind: Pod
metadata:
  name: multithread-test
  namespace: podtrace-test
  labels:
    app: multithread-test
spec:
  containers:
  - name: multithread
    image: python:3.15-slim@sha256:63bb298d2b7b88f176f51b5189f54ce6535c997682ea70885d2132f5d473a8a5
    command:
    - python3
    - -c
    - |
      import threading
      import time
      
      def cpu_worker(worker_id):
          while True:
              sum(range(10000))
              time.sleep(0.01)
      
      threads = []
      for i in range(4):
          t = threading.Thread(target=cpu_worker, args=(i,))
          t.daemon = True
          t.start()
          threads.append(t)
      
      while True:
          time.sleep(1)
